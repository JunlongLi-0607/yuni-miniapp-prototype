<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>芋泥 · 小程序原型全页总览</title><style>
*{box-sizing:border-box}body{margin:0;padding:48px;background:#edf0e9;color:#244234;font-family:'Segoe UI','Microsoft YaHei',sans-serif}header{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #d8e0d1;padding-bottom:25px;margin-bottom:30px}h1{font-size:30px;font-weight:600;margin:8px 0 12px}header p{font-size:13px;color:#7b8974;line-height:1.9}small{letter-spacing:2px;font-size:10px;color:#89977f}a{color:#277458;text-decoration:none;background:#dce7d2;padding:12px 18px;border-radius:9px;font-size:12px}h2{font-size:17px;font-weight:500;margin:32px 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,281px);gap:28px;align-items:start}.page h3{font-size:12px;font-weight:500;margin:0 0 13px;display:flex;gap:10px}.page h3 span{font-size:10px;color:#9aaa8d}.frame{width:281px;height:608px;overflow:hidden;border-radius:24px;box-shadow:0 8px 20px #233f3310;background:white}iframe{width:390px;height:844px;border:0;transform:scale(.72);transform-origin:top left;border-radius:32px}.page p{font-size:10px;color:#86977b;line-height:1.8;max-width:276px;margin-top:13px}.hint{font-size:11px;color:#7e8d72}@media(max-width:650px){body{padding:24px}header{display:block}header a{display:inline-block}.grid{justify-content:center}}@media print{body{padding:10px}.grid{gap:20px}.page{break-inside:avoid}header a{display:none}}
</style></head><body><header><div><small>YUNI / MINI PROGRAM / WIREFLOW 01</small><h1>课堂记录，从采集到复习。</h1><p>首页 / AI / 我的 · 沿用视频结构，补齐 Must 功能<br>17 页可交互总览 · 示例内容仅用于展示结构</p></div><a href="index.html">进入单屏交互原型 ↗</a></header><div id="gallery"></div><p class="hint">此总览使用独立示例状态，不会改动单屏原型中的演示数据。微信、硬件、录音与 AI 均为模拟。</p><script>
const groups=[['01 / 账户与课程',[['login','微信登录','授权登录并关联账户；登录后恢复原来的操作。'],['home','首页','课程列表、新建课程与录音入口。'],['course','课程详情','课程下按课时归档与定位。'],['lesson','课时详情','录音、笔记、考点、试卷四阶段。']]],['02 / 课堂采集与整理',[['capture','记录一堂课','小程序录音 / 录音卡 / 音频导入。'],['record','课堂录音','开始、暂停、结束；硬件模式同步实体按键状态。'],['transfer','录音卡回传','进度、取消重试、归档与转写衔接。'],['processing','转写与生成','语音转写、结构化笔记、关联原文位置。']]],['03 / 笔记与复习',[['notes','AI 课堂笔记','概要、知识要点、思维导图、重点标记。'],['edit','编辑与校正','文本编辑、备注、重点与原文对照。'],['transcript','录音与原文','笔记来源定位与模拟回听。'],['review','考点与复习','重点梳理、复习建议与试卷入口。'],['exam','押题练习','逐题作答、题号导航、提交确认。'],['results','试卷批阅','答案对照、逐题解析、薄弱点复习。']]],['04 / AI 与个人服务',[['ai','AI 学习助手','基于课程或课时提问，回答附来源。'],['mine','我的','账户、课程统计、额度与设备管理。'],['device','我的录音卡','绑定、电量、存储、连接状态与待回传录音。']]]];let i=0;
document.getElementById('gallery').innerHTML=groups.map(([title,pages])=>`<h2>${title}</h2><div class="grid">${pages.map(([id,name,desc])=>`<article class="page"><h3><span>${String(++i).padStart(2,'0')}</span>${name}</h3><div class="frame"><iframe title="${name}" src="index.html?gallery=1#${id}" loading="lazy"></iframe></div><p>${desc}</p></article>`).join('')}</div>`).join('');
</script></body></html>
